<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bell's Bookkeeping</title>
    <meta description="Bookkeeping Business Website ">
    <meta description=" he website will provide users the services we offer, how to contact us, about our experience and the information about the benefits of our services and how to sign up. ">
    <meta author="Nancy Bell">
    <title>thebellsbookkeeping</title>
    <link rel="stylesheet" href="/styles/form-mobile.css">
    <link rel="stylesheet" href="/styles/form-desktop.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <script defer src="scripts/form.js"></script>
    <script defer src="scripts/thanks.js"></script>

</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <main>
        
        <form method="get" action="thanks.html">
            <fieldset>
                <div>Please select the service you need</div>
                <select id="product" name="product">
                  <label> <input type="radio" name="rating" value="reconciliation"> Reconciliation </label>
                  <label> <input type="radio" name="rating" value="reports"> Financial Reports </label>
                  <label> <input type="radio" name="rating" value="cleanup"> Books Cleanup </label>
                  <label> <input type="radio" name="rating" value="all"> All the above </label>
                </select>
            </fieldset>
            <fieldset>
                <div>When would you like us to contact you? </div>
                <label for="date">Enter a date:</label>
                <input type="date" id="date" name="date">
            </fieldset>

            <fieldset>
                <div>What did you like the most about the product?
                    <br>
                    (Check all that apply)
                </div>
                <input type="checkbox" id="taste" name="taste" value="taste">
                <label for="taste"> Taste</label><br>
                <input type="checkbox" id="sweetness" name="sweetness" value="sweetness">
                <label for="sweetness">Sweetness</label><br>
                <input type="checkbox" id="after-taste" name="after-taste" value="after-taste">
                <label for="after-taste">After Taste</label><br><br>
            </fieldset>
            <fieldset>
                <div>Written Review (optional)</div>
                <textarea id="review" name="written-review" ></textarea>
                <br>
            </fieldset>
            <fieldset>
                <div>Your Name(optional)</div>
                <textarea id="name" name="written-review" ></textarea>
                <br>
            </fieldset>
            <input type="submit" value="Post Review">
        </form>

    <footer>
        <p><span id="currentYear"></span>©🗻Utah🗻 -USA- Nancy Bell</p>
        <p>Last Modified:<span id="lastModified"></span></p>
    </footer>

    </main>
</body>

</html>
